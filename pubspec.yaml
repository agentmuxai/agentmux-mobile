name: agentmux_mobile
description: AgentMux — cloud agent fleet companion
publish_to: 'none'
version: 0.2.0+28

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # Auth — Cognito PKCE via hosted UI
  flutter_web_auth_2: ^4.0.0
  crypto: ^3.0.3

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Routing
  go_router: ^14.8.1

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Mutex for concurrent 401 token refresh
  mutex: ^3.1.0

  # LAN discovery via mDNS
  multicast_dns: ^0.3.2+3
  # LAN discovery on iOS through the system's Bonjour browser (NWBrowser):
  # raw multicast (multicast_dns, the UDP probe) needs Apple's restricted
  # multicast entitlement on a real iOS device; Bonjour does not. 6.x is the
  # last line that supports the pinned Flutter 3.38 / Dart 3.10 (7.x's
  # bonsoir_darwin needs Dart 3.11).
  bonsoir: ^6.0.3

  # QR code fallback for LAN pairing
  # Pinned: 7.5.0's Android Kotlin does not compile with this project's toolchain (7.1.4 and 7.0.1 do).
  # 7.x scans with Apple's Vision framework on iOS, not Google ML Kit.
  mobile_scanner: 7.1.4

  # Utilities
  # Time source the fleet sessions read, so tests can drive it with fake_async.
  clock: ^1.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  xterm: ^4.0.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Source: assets/icon/agentmux-icon-mono.svg, AgentMux's main icon (variant 1: mono on a dark tile,
# square corners, flat colour, the same icon in the desktop app and the cloud console), rendered to
# assets/icon/icon.png (1024 px, opaque). The platform sizes (ios/.../AppIcon.appiconset, the Android
# mipmaps, the launch image) are that picture at each size. Regenerate with `dart run flutter_launcher_icons`
# after replacing icon.png, and redraw the launch image by hand. There is no light alternate here: only a
# platform that switches the icon with the theme by itself would use one.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # The source has an alpha channel (RGBA); Apple rejects any transparency
  # in the App Store icon, so this flattens it onto an opaque background
  # for iOS specifically. Android's adaptive/legacy icons keep the alpha.
  remove_alpha_ios: true
