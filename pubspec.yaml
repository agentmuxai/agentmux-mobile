name: agentmux_mobile
description: AgentMux Mobile — cloud agent fleet companion
publish_to: 'none'
version: 0.2.0+6

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # Auth — Cognito PKCE via hosted UI
  flutter_web_auth_2: ^4.0.0
  crypto: ^3.0.3

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Routing
  go_router: ^14.8.1

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Mutex for concurrent 401 token refresh
  mutex: ^3.1.0

  # LAN discovery via mDNS
  multicast_dns: ^0.3.2+3

  # QR code fallback for LAN pairing
  mobile_scanner: ^6.0.5

  # Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
