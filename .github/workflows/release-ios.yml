name: release-ios

# Builds a signed iOS .ipa and uploads it to TestFlight.
#
# Required repo secrets (Settings → Secrets → Actions) — NONE of these exist
# yet as of writing and need to be created. Note these are DISTINCT from
# build-macos.yml's Apple secrets: that workflow signs the macOS desktop app
# with a "Developer ID Application" certificate + notarizes it (APPLE_ID/
# APPLE_PASSWORD authenticate to notarytool). This workflow needs an "Apple
# Distribution" certificate (App Store signing, not Developer ID) plus an App
# Store Connect API key (Apple's current recommended auth for CI uploads —
# not an Apple ID/password, which is a different, legacy path being phased
# out for this use case):
#   IOS_DISTRIBUTION_CERTIFICATE       Base64-encoded "Apple Distribution" .p12
#   IOS_DISTRIBUTION_CERTIFICATE_PASSWORD  .p12 export password
#   IOS_PROVISIONING_PROFILE           Base64-encoded App Store .mobileprovision
#                                       for bundle ID com.agentmux.agentmuxMobile
#   APPSTORE_CONNECT_API_KEY           Base64-encoded App Store Connect API .p8
#   APPSTORE_CONNECT_API_KEY_ID        Key ID for the above
#   APPSTORE_CONNECT_ISSUER_ID         Issuer ID (App Store Connect → Users and Access → Keys)
#
# The API key's own access role must be "App Manager", not "Developer" —
# this workflow's optional submit-for-review path creates App Store versions
# and submits for review, which Developer-role keys cannot do (Developer can
# only upload builds / use TestFlight). See docs/specs/RELEASE_SIGNING_SETUP.md.
#
# APPLE_TEAM_ID (already exists as a repo/org secret for build-macos.yml) IS
# reusable here — Team ID is account-level, not tied to a certificate type.
#
# See docs/specs/RELEASE_SIGNING_SETUP.md for how to generate the
# certificate, provisioning profile, and App Store Connect API key.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "agentmux-mobile ref to build (tag / branch / SHA)"
        required: true
        default: main
      submit-for-review:
        description: "Also submit the build for App Store review (not just TestFlight)"
        required: true
        type: boolean
        default: false
      release-notes:
        description: "What's New text — required if submit-for-review is checked"
        required: false
        default: ""

jobs:
  build-and-upload:
    name: Build signed IPA & upload to TestFlight
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.submit-for-review }}" = "true" ] && [ -z "${{ inputs.release-notes }}" ]; then
            echo "::error::release-notes is required when submit-for-review is checked"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Apple Distribution codesigning setup ──────────────────────────────
      # Same short-lived-keychain pattern as agentmux's build-macos.yml, but
      # with an App Store distribution cert instead of Developer ID, plus a
      # provisioning profile (macOS Developer ID builds don't need one).
      - name: Import distribution certificate into temp keychain
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build-${{ github.run_id }}.keychain"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"

          echo "$IOS_DISTRIBUTION_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f /tmp/cert.p12

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/agentmux-mobile.mobileprovision"

      - name: Generate ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.agentmux.agentmuxMobile</key>
              <string>agentmux-mobile.mobileprovision</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build release IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          APPSTORE_CONNECT_API_KEY: ${{ secrets.APPSTORE_CONNECT_API_KEY }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_CONNECT_API_KEY" | base64 --decode > ~/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_ISSUER_ID"
          # Key file cleanup happens in "Clean up keychain" below, not here —
          # the optional submit-for-review step reuses this same decoded key.

      - name: Submit for App Store review
        if: ${{ inputs.submit-for-review }}
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          gem install fastlane -N -v '~> 2.238'
          export APPSTORE_CONNECT_API_KEY_PATH="$HOME/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
          IPA_PATH="$(ls "$GITHUB_WORKSPACE"/build/ios/ipa/*.ipa)"
          cd ios
          fastlane ios submit_for_review \
            ipa:"$IPA_PATH" \
            release_notes:"${{ inputs.release-notes }}"

      - name: Clean up keychain and signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f ios/ExportOptions.plist
          rm -rf ~/private_keys
