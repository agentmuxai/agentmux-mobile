name: release-android

# Builds a signed Android App Bundle and uploads it to Google Play.
#
# Required repo secrets (Settings > Secrets > Actions):
#   ANDROID_KEYSTORE                 Base64-encoded upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD        Keystore password
#   ANDROID_KEY_ALIAS                Key alias within the keystore
#   ANDROID_KEY_PASSWORD             Key password
#   GCP_WORKLOAD_IDENTITY_PROVIDER   Full resource name of the Workload Identity
#                                    Federation provider that trusts this repo
#   GCP_SERVICE_ACCOUNT              Email of the service account the upload acts as
#
# There is no service-account key file: the job trades GitHub's OIDC token for
# short-lived Google credentials (google-github-actions/auth). The provider only
# accepts this repository's main branch and this workflow, so run it from main.
#
# Play App Signing holds the app signing key; this keystore is only the upload key.
#
# See docs/specs/RELEASE_SIGNING_SETUP.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "agentmux-mobile ref to build (tag / branch / SHA)"
        required: true
        default: main
      track:
        description: "Play Console track to upload to"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status (a first upload to a new app must be draft)"
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft

jobs:
  build-and-upload:
    name: Build signed AAB & upload to Play
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Authenticate to Google (no key file)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: ai.agentmux.mobile
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/release.keystore android/key.properties
