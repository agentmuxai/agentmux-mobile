name: Dependency scan

# Checks the resolved Dart/Flutter dependency tree against known vulnerabilities
# in the OSV database (osv.dev, which carries the GitHub advisories for the Pub
# ecosystem), using Google's OSV-Scanner reusable workflow.
#
# It scans the committed pubspec.lock, which is exactly what the app is built
# with: ci.yml's `flutter pub get --enforce-lockfile` fails a PR whose lockfile
# doesn't match pubspec.yaml.
#
# On a pull request the job fails if any dependency has a known vulnerability;
# the table of findings is in the "Run osv-scanner-reporter" step's log. The
# weekly and manual runs also upload SARIF, so findings on main show up under
# Security > Code scanning. No secrets are needed.

on:
  pull_request:
    paths:
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/dependency-scan.yml
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: OSV-Scanner
    # The reusable workflow's job asks for exactly these; a caller has to grant
    # at least what it asks for. security-events: write is only used by the
    # SARIF upload, which is off on pull requests.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        --lockfile=./pubspec.lock
      upload-sarif: ${{ github.event_name != 'pull_request' }}
      fail-on-vuln: true
